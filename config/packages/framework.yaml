# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    # Query-string bust for public/css + public/js (hosting may cache static files).
    # Bump ASSETS_VERSION on each production frontend release.
    assets:
        version: '%env(default:assets_version_fallback:ASSETS_VERSION)%'
        version_format: '%%s?v=%%s'

    #esi: true
    #fragments: true

parameters:
    assets_version_fallback: '20260725j'
    # Fallback when SYMFONY_TRUSTED_PROXIES is unset (nginx on same host).
    trusted_proxies_default: '127.0.0.1'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        # Override in prod .env: SYMFONY_TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
        # Optionally: SYMFONY_TRUSTED_HOSTS=^arturlun\.ru$ (omit or leave unset to allow all hosts)
        trusted_proxies: '%env(default:trusted_proxies_default:SYMFONY_TRUSTED_PROXIES)%'
        trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']
