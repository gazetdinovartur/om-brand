security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    providers:
        app_admin_provider:
            entity:
                class: App\Entity\AdminUser
                property: email
        app_site_user_provider:
            id: App\Repository\SiteUserRepository
        app_users:
            chain:
                providers: [app_admin_provider, app_site_user_provider]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            pattern: ^/admin
            context: app
            lazy: true
            provider: app_admin_provider
            entry_point: App\Security\AdminLoginEntryPoint
            access_denied_handler: App\Security\AdminAccessDeniedHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: admin_login
                check_path: admin_login
                default_target_path: admin
                enable_csrf: true
            webauthn:
                authentication:
                    enabled: true
                    profile: admin
                    routes:
                        options_path: /admin/passkey/login/options
                        result_path: /admin/passkey/login
                registration: false
            logout:
                path: admin_logout
                target: admin_login
        main:
            pattern: ^/
            context: app
            lazy: true
            provider: app_users
            entry_point: App\Security\LibraryLoginEntryPoint
            custom_authenticators:
                - App\Security\SiteUserAuthenticator
            webauthn:
                authentication:
                    enabled: true
                    profile: site
                    routes:
                        options_path: /library/passkey/login/options
                        result_path: /library/passkey/login
                registration: false
            logout:
                path: web_library_logout
                target: web_home

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/passkey/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/oauth/vk, roles: ROLE_ADMIN }
        - { path: ^/webhooks/yookassa, roles: PUBLIC_ACCESS }
        - { path: ^/webhooks/kinescope, roles: PUBLIC_ACCESS }
        - { path: ^/meet/, roles: PUBLIC_ACCESS }
        - { path: ^/library/login, roles: PUBLIC_ACCESS }
        - { path: ^/library/passkey/login, roles: PUBLIC_ACCESS }
        - { path: ^/library/logout, roles: PUBLIC_ACCESS }
        - { path: ^/library, roles: [ROLE_USER, ROLE_ADMIN] }
        - { path: ^/account, roles: [ROLE_USER, ROLE_ADMIN] }
        - { path: ^/practice/room, roles: [ROLE_USER, ROLE_ADMIN] }
